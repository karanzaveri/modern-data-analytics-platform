version: 2

models:
  - name: stg_orders
    description: Clean staging model for Olist order records.

    columns:
      - name: order_id
        description: Unique identifier for an order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier of the customer associated with the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        description: Current status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable